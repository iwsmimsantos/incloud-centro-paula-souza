version: '3'

services:
  backend:
    build: ./backend
    restart: always
    networks:
      - incloudg3       
    container_name: backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-4040}:3000"
    depends_on:
      - database

  frontend:
    build: ./front
    restart: always
    networks:
      - incloudg3     
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-8090}:4200"
    depends_on:
      - backend

  database:
    image: mysql:8
    restart: always
    networks:
      - incloudg3 
    container_name: database
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3351}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

networks:
  incloudg3:
    driver: bridge

volumes:
  db_data:
