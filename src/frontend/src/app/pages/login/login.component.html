<div
  class="login-container"
  [ngStyle]="{
    'background-image': 'url(assets/images/fundo.jpg)',
    'background-repeat': 'no-repeat',
    'background-size': 'cover',
    'background-position': 'center',
    'min-height': '100vh',
    width: '100%',
    margin: '0',
    padding: '0',
    overflow: 'hidden',
    position: 'absolute',
    top: '0',
    left: '0',
  }"
>
  <div class="login-card">
    <div class="login-header">
      <div class="logo-container">
        <img src="assets/images/logo_login.png" alt="Bem-Vindo!" class="logo" />
        <h1>Bem-Vindo<span class="cps">!</span></h1>
      </div>
    </div>

    <div class="login-body">
      <button class="login-button" (click)="login()" [disabled]="isLoading">
        <span *ngIf="!isLoading">Faça login para continuar</span>
        <span *ngIf="isLoading">Carregando...</span>
      </button>
    </div>
  </div>
</div>
